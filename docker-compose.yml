version: '3.8'

services:
  # MySQL 服务
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ecommerce_db
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ecommerce-network
    # 内存限制（4GB 服务器，MySQL 预留 1GB）
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m

  # Spring Boot 应用服务
  app:
    build: .
    container_name: ecommerce-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/ecommerce_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root123
    depends_on:
      - mysql
    networks:
      - ecommerce-network
    # 内存限制（JVM 已在 Dockerfile 中限制 512MB，容器上限 768MB）
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 256m

# 网络配置（让两个容器在同一网络，可互相访问）
networks:
  ecommerce-network:
    driver: bridge

# 数据卷（持久化 MySQL 数据）
volumes:
  mysql-data:
