# 服务器端口（Docker 映射用）
server.port=8080

# 数据库配置（连接 Docker 中的 MySQL）
spring.datasource.url=jdbc:mysql://mysql:3306/ecommerce_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 配置（自动建表、显示SQL）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Thymeleaf 配置（开发时禁用缓存）
spring.thymeleaf.cache=false

# 日志配置（显示SQL）
logging.level.org.hibernate.SQL=DEBUG

# 数据初始化配置
app.init-data=true
app.admin.username=admin
app.admin.password=admin123
app.admin.fullName=系统管理员
app.sales.username=sales01
app.sales.password=sales123
app.sales.fullName=销售员小王
app.test.username=testuser
app.test.password=123456
app.test.fullName=测试用户
