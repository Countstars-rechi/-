<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理仪表盘 - 电商网站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
    <th:block th:replace="fragments/navbar :: admin('dashboard')"></th:block>

    <div class="container mt-4">
        <h2>系统管理仪表盘</h2>

        <!-- 概览卡片 -->
        <div class="row mt-4">
            <div class="col-md-3">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h5 class="card-title">总销售额</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(dashboard.totalSales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <h5 class="card-title">今日销售额</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(dashboard.todaySales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-info">
                    <div class="card-body">
                        <h5 class="card-title">客户数</h5>
                        <p class="card-text h3" th:text="${dashboard.customerCount}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-warning">
                    <div class="card-body">
                        <h5 class="card-title">销售人员</h5>
                        <p class="card-text h3" th:text="${dashboard.salesCount}">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 第二行卡片 -->
        <div class="row mt-3">
            <div class="col-md-3">
                <div class="card text-white bg-secondary">
                    <div class="card-body">
                        <h5 class="card-title">待付款订单</h5>
                        <p class="card-text h3" th:text="${dashboard.pendingOrders}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-info">
                    <div class="card-body">
                        <h5 class="card-title">已付款订单</h5>
                        <p class="card-text h3" th:text="${dashboard.paidOrders}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <h5 class="card-title">已完成订单</h5>
                        <p class="card-text h3" th:text="${dashboard.completedOrders}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h5 class="card-title">今日浏览</h5>
                        <p class="card-text h3" th:text="${dashboard.todayBrowseCount}">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="row mt-4">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header"><h5>销售趋势（近7天）</h5></div>
                    <div class="card-body"><div id="trendChart" style="height:350px;"></div></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header"><h5>订单状态分布</h5></div>
                    <div class="card-body"><div id="orderPieChart" style="height:350px;"></div></div>
                </div>
            </div>
        </div>

        <!-- 异常检测 -->
        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header"><h5>销售异常检测</h5></div>
                    <div class="card-body">
                        <p>7天平均销售额: <strong th:text="'¥' + ${#numbers.formatDecimal(anomalies.averageSales, 1, 2)}">¥0</strong></p>
                        <div th:if="${#lists.isEmpty(anomalies.anomalies)}" class="text-muted">近7天销售正常，无异常</div>
                        <div th:each="a : ${anomalies.anomalies}" class="alert" th:classappend="${a.level == '警告'} ? 'alert-warning' : 'alert-info'">
                            <strong th:text="${a.date}"></strong> —
                            销售额: <strong th:text="'¥' + ${#numbers.formatDecimal(a.sales, 1, 2)}"></strong>
                            (<span th:text="${a.type}"></span>，<span th:text="${a.level}"></span>)
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        // 销售趋势折线图
        var trendChart = echarts.init(document.getElementById('trendChart'));
        trendChart.setOption({
            tooltip: { trigger: 'axis' },
            xAxis: {
                type: 'category',
                data: [[${trend.dates}]]
            },
            yAxis: { type: 'value', name: '销售额 (¥)' },
            series: [{
                name: '销售额',
                type: 'line',
                data: [[${trend.sales}]],
                smooth: true,
                areaStyle: { opacity: 0.1 },
                itemStyle: { color: '#0d6efd' }
            }]
        });

        // 订单状态饼图
        var pieChart = echarts.init(document.getElementById('orderPieChart'));
        pieChart.setOption({
            tooltip: { trigger: 'item' },
            legend: { bottom: 0 },
            series: [{
                type: 'pie',
                radius: ['40%', '70%'],
                data: [
                    { value: [[${dashboard.pendingOrders}]], name: '待付款', itemStyle: { color: '#ffc107' } },
                    { value: [[${dashboard.paidOrders}]], name: '已付款', itemStyle: { color: '#0d6efd' } },
                    { value: [[${dashboard.completedOrders}]], name: '已完成', itemStyle: { color: '#198754' } }
                ]
            }]
        });
    </script>
</body>
</html>
