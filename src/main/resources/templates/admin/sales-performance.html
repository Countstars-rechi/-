<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>销售业绩 - 电商网站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand" href="/admin/dashboard">系统管理</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/admin/dashboard">仪表盘</a>
                <a class="nav-link" href="/admin/sales-users">销售人员管理</a>
                <a class="nav-link active" href="/admin/sales-performance">销售业绩</a>
                <a class="nav-link" href="/admin/operation-logs">操作日志</a>
                <a class="nav-link" href="/admin/user-profile">用户画像</a>
                <span class="nav-link text-light">[[${username}]]</span>
                <a class="nav-link text-light" href="/products">前台</a>
                <a class="nav-link text-light" href="/logout">退出</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>销售业绩</h2>

        <div class="row mt-4">
            <div class="col-md-3">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h5 class="card-title">总销售额</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(totalSales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <h5 class="card-title">今日</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(todaySales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-info">
                    <div class="card-body">
                        <h5 class="card-title">本周</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(weekSales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-warning">
                    <div class="card-body">
                        <h5 class="card-title">本月</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(monthSales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>商品销售排行榜</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>排名</th>
                                    <th>商品</th>
                                    <th>类别</th>
                                    <th>销量</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${ranking}">
                                    <td th:text="${item.rank}">1</td>
                                    <td th:text="${item.productName}">商品</td>
                                    <td th:text="${item.category}">类别</td>
                                    <td th:text="${item.totalSold}">0</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>订单状态统计</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>状态</th>
                                    <th>数量</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="entry : ${orderStatusCount}">
                                    <td th:text="${entry.key == 'PENDING' ? '待付款' : 
                                        (entry.key == 'PAID' ? '已付款' : 
                                        (entry.key == 'COMPLETED' ? '已完成' : '已取消'))}">状态</td>
                                    <td th:text="${entry.value}">0</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5>销售趋势（近30天）</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>日期</th>
                                    <th>销售额</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="i : ${#numbers.sequence(0, #lists.size(trend.dates) - 1)}">
                                    <td th:text="${trend.dates[i]}">日期</td>
                                    <td th:text="'¥' + ${#numbers.formatDecimal(trend.sales[i], 1, 2)}">¥0</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
