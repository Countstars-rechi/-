<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>销售业绩 - 电商网站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
    <th:block th:replace="fragments/navbar :: admin('sales-performance')"></th:block>

    <div class="container mt-4">
        <h2>销售业绩</h2>

        <div class="row mt-4">
            <div class="col-md-3">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h5 class="card-title">总销售额</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(totalSales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <h5 class="card-title">今日</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(todaySales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-info">
                    <div class="card-body">
                        <h5 class="card-title">本周</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(weekSales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-warning">
                    <div class="card-body">
                        <h5 class="card-title">本月</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(monthSales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 趋势图 + 排名图 -->
        <div class="row mt-4">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header"><h5>销售趋势（近30天）</h5></div>
                    <div class="card-body"><div id="trendChart" style="height:350px;"></div></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header"><h5>订单状态统计</h5></div>
                    <div class="card-body"><div id="statusPieChart" style="height:350px;"></div></div>
                </div>
            </div>
        </div>

        <!-- 排行榜 -->
        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header"><h5>商品销售排行榜</h5></div>
                    <div class="card-body"><div id="rankingChart" style="height:400px;"></div></div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        // 趋势图
        var trendChart = echarts.init(document.getElementById('trendChart'));
        trendChart.setOption({
            tooltip: { trigger: 'axis' },
            dataZoom: [{ type: 'slider', start: 50, end: 100 }],
            xAxis: { type: 'category', data: [[${trend.dates}]] },
            yAxis: { type: 'value', name: '销售额 (¥)' },
            series: [{
                name: '销售额', type: 'line', smooth: true,
                data: [[${trend.sales}]],
                areaStyle: { opacity: 0.1 },
                itemStyle: { color: '#dc3545' }
            }]
        });

        // 订单状态饼图
        var pieChart = echarts.init(document.getElementById('statusPieChart'));
        pieChart.setOption({
            tooltip: { trigger: 'item' },
            legend: { bottom: 0 },
            series: [{
                type: 'pie',
                radius: ['35%', '65%'],
                data: [
                    { value: [[${orderStatusCount['PENDING'] ?: 0}]], name: '待付款', itemStyle: { color: '#ffc107' } },
                    { value: [[${orderStatusCount['PAID'] ?: 0}]], name: '已付款', itemStyle: { color: '#0d6efd' } },
                    { value: [[${orderStatusCount['SHIPPED'] ?: 0}]], name: '已发货', itemStyle: { color: '#6f42c1' } },
                    { value: [[${orderStatusCount['COMPLETED'] ?: 0}]], name: '已完成', itemStyle: { color: '#198754' } },
                    { value: [[${orderStatusCount['CANCELLED'] ?: 0}]], name: '已取消', itemStyle: { color: '#6c757d' } }
                ]
            }]
        });

        // 排行榜
        var rankChart = echarts.init(document.getElementById('rankingChart'));
        rankChart.setOption({
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
            grid: { left: '20%', right: '4%', bottom: '3%', containLabel: true },
            xAxis: { type: 'value', name: '销量' },
            yAxis: {
                type: 'category',
                data: [[${ranking.![productName + ' (¥' + price + ')']}]].reverse()
            },
            series: [{
                type: 'bar',
                data: [[${ranking.![totalSold]}]].reverse(),
                itemStyle: { color: '#dc3545' }
            }]
        });
    </script>
</body>
</html>
