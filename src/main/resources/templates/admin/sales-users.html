<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>销售人员管理 - 电商网站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand" href="/admin/dashboard">系统管理</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/admin/dashboard">仪表盘</a>
                <a class="nav-link active" href="/admin/sales-users">销售人员管理</a>
                <a class="nav-link" href="/admin/sales-performance">销售业绩</a>
                <a class="nav-link" href="/admin/operation-logs">操作日志</a>
                <a class="nav-link" href="/admin/user-profile">用户画像</a>
                <span class="nav-link text-light">[[${username}]]</span>
                <a class="nav-link text-light" href="/products">前台</a>
                <a class="nav-link text-light" href="/logout">退出</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between">
            <h2>销售人员管理</h2>
            <a href="/admin/sales-users/add" class="btn btn-danger">添加销售人员</a>
        </div>

        <div th:if="${param.added}" class="alert alert-success mt-3">销售人员添加成功！</div>
        <div th:if="${param.reset}" class="alert alert-success mt-3">密码重置成功！</div>
        <div th:if="${param.toggled}" class="alert alert-warning mt-3">账号状态已更改！</div>

        <table class="table table-striped mt-3">
            <thead>
                <tr>
                    <th>用户名</th>
                    <th>姓名</th>
                    <th>角色</th>
                    <th>状态</th>
                    <th>最后登录</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${salesUsers}">
                    <td th:text="${user.username}">用户名</td>
                    <td th:text="${user.fullName}">姓名</td>
                    <td th:text="${user.role}">角色</td>
                    <td>
                        <span class="badge" th:classappend="${user.enabled} ? 'bg-success' : 'bg-secondary'"
                              th:text="${user.enabled} ? '启用' : '禁用'"></span>
                    </td>
                    <td th:text="${user.lastLoginAt}">2024-01-01</td>
                    <td>
                        <a th:href="@{/admin/sales-users/toggle/{username}(username=${user.username})}"
                           class="btn btn-sm" th:classappend="${user.enabled} ? 'btn-warning' : 'btn-success'"
                           th:text="${user.enabled} ? '禁用' : '启用'"></a>
                        <button class="btn btn-sm btn-info" data-bs-toggle="modal"
                                th:attr="data-bs-target='#resetModal' + ${user.id}">重置密码</button>

                        <!-- 重置密码模态框 -->
                        <div th:id="'resetModal' + ${user.id}" class="modal fade" tabindex="-1">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <form th:action="@{/admin/sales-users/reset-password}" method="post">
                                        <div class="modal-header">
                                            <h5 class="modal-title">重置密码 - <span th:text="${user.username}"></span></h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                        </div>
                                        <div class="modal-body">
                                            <input type="hidden" name="username" th:value="${user.username}">
                                            <div class="mb-3">
                                                <label class="form-label">新密码</label>
                                                <input type="password" name="newPassword" class="form-control" required minlength="6">
                                            </div>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="submit" class="btn btn-primary">确认重置</button>
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
