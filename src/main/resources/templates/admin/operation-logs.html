<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>操作日志 - 电商网站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <th:block th:replace="fragments/navbar :: admin('operation-logs')"></th:block>

    <div class="container mt-4">
        <h2>操作日志</h2>

        <div th:if="${#lists.isEmpty(logs)}" class="alert alert-info mt-3">暂无操作日志</div>

        <div th:unless="${#lists.isEmpty(logs)}" class="mt-3">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>操作人</th>
                        <th>操作类型</th>
                        <th>操作内容</th>
                        <th>IP地址</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="log : ${logs}">
                        <td th:text="${log.createdAt}">2024-01-01 12:00</td>
                        <td th:text="${log.operator}">admin</td>
                        <td>
                            <span class="badge" th:classappend="${log.operationType == 'ADMIN'} ? 'bg-danger' : 
                                (${log.operationType == 'SALES'} ? 'bg-success' : 'bg-info')"
                                th:text="${log.operationType}">类型</span>
                        </td>
                        <td th:text="${log.detail}">操作内容</td>
                        <td th:text="${log.ipAddress}">127.0.0.1</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
