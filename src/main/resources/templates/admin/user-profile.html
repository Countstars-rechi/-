<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户画像 - 电商网站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <th:block th:replace="fragments/navbar :: admin('user-profile')"></th:block>

    <div class="container mt-4">
        <h2>用户画像分析</h2>

        <div class="card mt-4">
            <div class="card-body">
                <form class="row g-3" th:action="@{/admin/user-profile}" method="get">
                    <div class="col-md-6">
                        <input type="text" class="form-control" name="username" placeholder="输入用户名查询"
                               th:value="${searchUsername}">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary">查询</button>
                    </div>
                </form>
            </div>
        </div>

        <div th:if="${profile != null}" class="mt-4">
            <div class="card">
                <div class="card-header">
                    <h5>用户基本信息</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>用户名：</strong><span th:text="${profile.username}">user</span></p>
                            <p><strong>昵称：</strong><span th:text="${profile.fullName}">姓名</span></p>
                            <p><strong>邮箱：</strong><span th:text="${profile.email}">email@example.com</span></p>
                            <p><strong>电话：</strong><span th:text="${profile.phone}">13800138000</span></p>
                            <p><strong>地区：</strong><span th:text="${profile.region}">北京</span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>注册时间：</strong><span th:text="${profile.createdAt}">2024-01-01</span></p>
                            <p><strong>总订单数：</strong><span th:text="${profile.totalOrders}">0</span></p>
                            <p><strong>总消费金额：</strong><span th:text="'¥' + ${#numbers.formatDecimal(profile.totalSpent, 1, 2)}">¥0</span></p>
                            <p><strong>平均订单金额：</strong><span th:text="'¥' + ${#numbers.formatDecimal(profile.avgOrderAmount, 1, 2)}">¥0</span></p>
                            <p><strong>活跃度：</strong>
                                <span class="badge" th:classappend="${profile.activityLevel == '高'} ? 'bg-success' : 
                                    (${profile.activityLevel == '中'} ? 'bg-warning' : 'bg-secondary')"
                                    th:text="${profile.activityLevel}">中</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mt-3">
                <div class="card-header">
                    <h5>偏好分析</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <h6>偏好类别</h6>
                            <ul>
                                <li th:each="cat : ${profile.preferredCategories}" th:text="${cat}">类别</li>
                            </ul>
                            <div th:if="${#lists.isEmpty(profile.preferredCategories)}" class="text-muted">暂无数据</div>
                        </div>
                        <div class="col-md-6">
                            <h6>最近浏览</h6>
                            <ul>
                                <li th:each="browse : ${profile.recentBrowses}" th:text="${browse}">商品</li>
                            </ul>
                            <div th:if="${#lists.isEmpty(profile.recentBrowses)}" class="text-muted">暂无数据</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${searchUsername != null and profile == null}" class="alert alert-warning mt-4">
            未找到用户: <strong th:text="${searchUsername}">user</strong>
        </div>
    </div>
</body>
</html>
