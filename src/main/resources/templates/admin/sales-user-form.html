<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>添加销售人员 - 电商网站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand" href="/admin/dashboard">系统管理</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/admin/dashboard">仪表盘</a>
                <a class="nav-link active" href="/admin/sales-users">销售人员管理</a>
                <a class="nav-link" href="/admin/sales-performance">销售业绩</a>
                <a class="nav-link" href="/admin/operation-logs">操作日志</a>
                <a class="nav-link" href="/admin/user-profile">用户画像</a>
                <span class="nav-link text-light">[[${username}]]</span>
                <a class="nav-link text-light" href="/products">前台</a>
                <a class="nav-link text-light" href="/logout">退出</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>添加销售人员</h2>

        <div th:if="${param.error}" class="alert alert-danger mt-3" th:text="${param.error}"></div>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <form th:action="@{/admin/sales-users/add}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">用户名 *</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">密码 *</label>
                                <input type="password" class="form-control" id="password" name="password" required minlength="6">
                            </div>
                            <div class="mb-3">
                                <label for="fullName" class="form-label">姓名 *</label>
                                <input type="text" class="form-control" id="fullName" name="fullName" required>
                            </div>
                            <button type="submit" class="btn btn-danger">添加</button>
                            <a href="/admin/sales-users" class="btn btn-outline-secondary">取消</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
