<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>电商网站 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-3">
                    <a href="/products" class="text-decoration-none">
                        <h4 class="text-dark fw-bold">电商网站</h4>
                    </a>
                </div>

                <!-- 角色选择 -->
                <div class="d-flex gap-2 mb-3" role="group">
                    <button class="btn btn-primary flex-fill active" id="btn-customer"
                            onclick="switchRole('customer')">顾客登录</button>
                    <button class="btn btn-outline-success flex-fill" id="btn-sales"
                            onclick="switchRole('sales')">销售登录</button>
                    <button class="btn btn-outline-danger flex-fill" id="btn-admin"
                            onclick="switchRole('admin')">管理登录</button>
                </div>

                <!-- 登录卡片 -->
                <div class="card" id="login-card" style="border-top: 4px solid #2563eb;">
                    <div class="card-body p-4">
                        <!-- 角色标题 -->
                        <h5 class="text-center mb-3" id="role-title">顾客登录</h5>

                        <!-- 消息提示 -->
                        <div th:if="${param.error}" class="alert alert-danger py-2 small">用户名或密码错误</div>
                        <div th:if="${param.logout}" class="alert alert-success py-2 small">已成功退出登录</div>
                        <div th:if="${param.registered}" class="alert alert-success py-2 small">注册成功，请登录</div>

                        <!-- 登录表单 -->
                        <form th:action="@{/login}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <div class="mb-3">
                                <label for="username" class="form-label small fw-bold text-secondary">用户名</label>
                                <input type="text" class="form-control" id="username" name="username"
                                       placeholder="请输入用户名" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label small fw-bold text-secondary">密码</label>
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="请输入密码" required>
                            </div>
                            <button type="submit" class="btn w-100 fw-bold" id="login-btn"
                                    style="background:#2563eb;color:#fff;">登 录</button>
                        </form>

                        <!-- 示例账号 -->
                        <div class="mt-3 p-3 rounded" id="demo-box" style="background:#eff6ff;">
                            <div class="d-flex align-items-center gap-2 mb-1">
                                <span class="badge bg-primary" id="demo-badge">顾客</span>
                                <span class="small text-muted">示例账号</span>
                            </div>
                            <code class="small" id="demo-account">testuser / 123456</code>
                        </div>

                        <div class="mt-3 text-center small">
                            <a href="/products">返回首页</a> &nbsp;|&nbsp;
                            <a href="/register">还没有账号？立即注册</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const roles = {
            customer: {
                name: '顾客登录',
                color: '#2563eb',
                bg: '#eff6ff',
                badge: 'bg-primary',
                badgeText: '顾客',
                account: 'testuser / 123456',
                btnClass: 'btn-primary',
                btnOutClass: 'btn-outline-primary'
            },
            sales: {
                name: '销售登录',
                color: '#059669',
                bg: '#ecfdf5',
                badge: 'bg-success',
                badgeText: '销售',
                account: 'sales01 / sales123',
                btnClass: 'btn-success',
                btnOutClass: 'btn-outline-success'
            },
            admin: {
                name: '管理登录',
                color: '#dc2626',
                bg: '#fef2f2',
                badge: 'bg-danger',
                badgeText: '管理',
                account: 'admin / admin123',
                btnClass: 'btn-danger',
                btnOutClass: 'btn-outline-danger'
            }
        };

        function switchRole(role) {
            const r = roles[role];
            // card border
            document.getElementById('login-card').style.borderTopColor = r.color;
            // title
            document.getElementById('role-title').textContent = r.name;
            // login button
            const lb = document.getElementById('login-btn');
            lb.style.background = r.color;
            lb.style.color = '#fff';
            // demo box
            document.getElementById('demo-box').style.background = r.bg;
            document.getElementById('demo-badge').className = 'badge ' + r.badge;
            document.getElementById('demo-badge').textContent = r.badgeText;
            document.getElementById('demo-account').textContent = r.account;
            // top buttons
            ['customer','sales','admin'].forEach(k => {
                const btn = document.getElementById('btn-' + k);
                if (k === role) {
                    btn.className = 'btn flex-fill active ' + r.btnClass;
                } else {
                    btn.className = 'btn flex-fill ' + roles[k].btnOutClass;
                }
            });
        }
    </script>
</body>
</html>
