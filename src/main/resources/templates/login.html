<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>电商网站 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header text-center">
                        <h3>电商网站登录</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/login}" method="post">
                            <div th:if="${param.error}" class="alert alert-danger">
                                用户名或密码错误！
                            </div>
                            <div th:if="${param.logout}" class="alert alert-success">
                                已成功退出登录！
                            </div>
                            <div th:if="${param.registered}" class="alert alert-success">
                                注册成功！请登录。
                            </div>

                            <div class="mb-3">
                                <label for="username" class="form-label">用户名</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">密码</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">登录</button>
                        </form>
                        <div class="mt-3 text-center">
                            <a href="/register">还没有账号？立即注册</a>
                        </div>
                        <div class="mt-3">
                            <div class="card bg-light">
                                <div class="card-body small">
                                    <h6 class="card-title text-muted">示例账号</h6>
                                    <table class="table table-sm table-borderless mb-0">
                                        <tr><td width="60"><span class="badge bg-primary">顾客</span></td><td>testuser / 123456</td></tr>
                                        <tr><td><span class="badge bg-success">销售</span></td><td>sales01 / sales123</td></tr>
                                        <tr><td><span class="badge bg-danger">管理</span></td><td>admin / admin123</td></tr>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
