<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>结算 - 电商网站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body>
    <th:block th:replace="fragments/navbar :: customerLoggedIn('cart')"></th:block>

    <div class="container mt-4">
        <h2>订单结算</h2>

        <div th:if="${param.error}" class="alert alert-danger" th:text="${param.error}"></div>

        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5>收货信息</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/cart/checkout}" method="post">
                            <div class="mb-3">
                                <label for="receiverName" class="form-label">收货人 *</label>
                                <input type="text" class="form-control" id="receiverName" name="receiverName" required>
                            </div>
                            <div class="mb-3">
                                <label for="receiverPhone" class="form-label">联系电话 *</label>
                                <input type="text" class="form-control" id="receiverPhone" name="receiverPhone" required>
                            </div>
                            <div class="mb-3">
                                <label for="shippingAddress" class="form-label">收货地址 *</label>
                                <textarea class="form-control" id="shippingAddress" name="shippingAddress" rows="3" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-success btn-lg w-100">提交订单</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5>订单摘要</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>商品</th>
                                    <th>数量</th>
                                    <th>小计</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${cartItems}">
                                    <td th:text="${item.product.name}">商品</td>
                                    <td th:text="${item.quantity}">1</td>
                                    <td th:text="'¥' + ${item.product.price * item.quantity}">¥0</td>
                                </tr>
                            </tbody>
                        </table>
                        <hr>
                        <p class="text-end fw-bold">
                            总计: <span class="text-danger" th:text="'¥' + ${#aggregates.sum(cartItems.![product.price * quantity])}">¥0</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
