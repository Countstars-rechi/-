<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>订单详情 - 电商网站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/products">电商网站</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/products">商品列表</a>
                <a class="nav-link" href="/cart">购物车</a>
                <a class="nav-link" href="/orders">我的订单</a>
                <span class="nav-link text-light">欢迎，[[${username}]]</span>
                <a class="nav-link text-light" href="/logout">退出</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div th:if="${param.success}" class="alert alert-success">订单创建成功！请尽快付款。</div>
        <div th:if="${param.paid}" class="alert alert-success">支付成功！</div>
        <div th:if="${param.cancelled}" class="alert alert-warning">订单已取消。</div>
        <div th:if="${param.error}" class="alert alert-danger" th:text="${param.error}"></div>

        <h2>订单详情</h2>
        <hr>

        <div class="row">
            <div class="col-md-6">
                <p><strong>订单号：</strong><span th:text="${order.orderNo}">ORD123</span></p>
                <p><strong>下单时间：</strong><span th:text="${order.createdAt}">2024-01-01</span></p>
                <p><strong>订单状态：</strong>
                    <span class="badge" th:classappend="${order.status == 'PENDING'} ? 'bg-warning' : 
                        (${order.status == 'PAID'} ? 'bg-success' : 
                        (${order.status == 'COMPLETED'} ? 'bg-info' : 'bg-secondary'))"
                        th:text="${order.status == 'PENDING' ? '待付款' : 
                            (order.status == 'PAID' ? '已付款' : 
                            (order.status == 'COMPLETED' ? '已完成' : '已取消'))}">
                        状态
                    </span>
                </p>
            </div>
            <div class="col-md-6">
                <p><strong>收货人：</strong><span th:text="${order.receiverName}">张三</span></p>
                <p><strong>联系电话：</strong><span th:text="${order.receiverPhone}">13800138000</span></p>
                <p><strong>收货地址：</strong><span th:text="${order.shippingAddress}">地址</span></p>
            </div>
        </div>

        <h4 class="mt-4">商品列表</h4>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>商品</th>
                    <th>单价</th>
                    <th>数量</th>
                    <th>小计</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${order.orderItems}">
                    <td th:text="${item.product.name}">商品</td>
                    <td th:text="'¥' + ${item.price}">¥0</td>
                    <td th:text="${item.quantity}">1</td>
                    <td th:text="'¥' + ${item.price * item.quantity}">¥0</td>
                </tr>
            </tbody>
        </table>

        <div class="text-end">
            <h4 class="text-danger" th:text="'总计: ¥' + ${order.totalAmount}">¥0</h4>
        </div>

        <div class="mt-3" th:if="${order.status == 'PENDING'}">
            <form th:action="@{/orders/{id}/pay(id=${order.id})}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-success btn-lg">立即付款</button>
            </form>
            <form th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post" style="display:inline;"
                  onsubmit="return confirm('确定取消此订单？')">
                <button type="submit" class="btn btn-outline-danger btn-lg ms-2">取消订单</button>
            </form>
            <a href="/orders" class="btn btn-outline-secondary btn-lg ms-2">返回订单列表</a>
        </div>
        <div th:unless="${order.status == 'PENDING'}">
            <a href="/orders" class="btn btn-outline-secondary">返回订单列表</a>
        </div>
    </div>
</body>
</html>
