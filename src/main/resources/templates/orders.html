<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的订单 - 电商网站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body>
    <th:block th:replace="fragments/navbar :: customerLoggedIn('orders')"></th:block>

    <div class="container mt-4">
        <h2>我的订单</h2>

        <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info mt-3">
            暂无订单 <a href="/products">去购物</a>
        </div>

        <div th:unless="${#lists.isEmpty(orders)}" class="mt-3">
            <div th:each="order : ${orders}" class="card mb-3">
                <div class="card-header d-flex justify-content-between">
                    <span>订单号: <strong th:text="${order.orderNo}">ORD123</strong></span>
                    <span th:text="${order.createdAt}">2024-01-01</span>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-8">
                            <table class="table table-sm">
                                <thead>
                                    <tr>
                                        <th>商品</th>
                                        <th>单价</th>
                                        <th>数量</th>
                                        <th>小计</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${order.orderItems}">
                                        <td th:text="${item.product.name}">商品</td>
                                        <td th:text="'¥' + ${item.price}">¥0</td>
                                        <td th:text="${item.quantity}">1</td>
                                        <td th:text="'¥' + ${item.price * item.quantity}">¥0</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="col-md-4 text-end">
                            <p class="h5 text-danger" th:text="'总计: ¥' + ${order.totalAmount}">¥0</p>
                            <p>
                                <span class="badge" th:classappend="${order.status == 'PENDING'} ? 'bg-warning' : 
                                    (${order.status == 'PAID'} ? 'bg-success' : 
                                    (${order.status == 'COMPLETED'} ? 'bg-info' : 'bg-secondary'))"
                                    th:text="${order.status == 'PENDING' ? '待付款' : 
                                        (order.status == 'PAID' ? '已付款' : 
                                        (order.status == 'COMPLETED' ? '已完成' : '已取消'))}">
                                    状态
                                </span>
                            </p>
                            <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary">查看详情</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
