<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品管理 - 电商网站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body>
    <th:block th:replace="fragments/navbar :: sales('products')"></th:block>

    <div class="container mt-4">
        <div class="d-flex justify-content-between">
            <h2>商品管理</h2>
            <a href="/sales/products/add" class="btn btn-success">添加商品</a>
        </div>

        <div th:if="${param.added}" class="alert alert-success mt-3">商品添加成功！</div>
        <div th:if="${param.updated}" class="alert alert-success mt-3">商品更新成功！</div>
        <div th:if="${param.disabled}" class="alert alert-warning mt-3">商品已下架！</div>

        <table class="table table-striped mt-3">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>名称</th>
                    <th>类别</th>
                    <th>价格</th>
                    <th>库存</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}">1</td>
                    <td th:text="${product.name}">商品</td>
                    <td th:text="${product.category}">类别</td>
                    <td th:text="'¥' + ${product.price}">¥0</td>
                    <td th:text="${product.stock}">0</td>
                    <td>
                        <span class="badge" th:classappend="${product.enabled} ? 'bg-success' : 'bg-secondary'"
                              th:text="${product.enabled} ? '上架' : '下架'"></span>
                    </td>
                    <td>
                        <a th:href="@{/sales/products/edit/{id}(id=${product.id})}" class="btn btn-sm btn-primary">编辑</a>
                        <form th:if="${product.enabled}" th:action="@{/sales/products/disable/{id}(id=${product.id})}" method="post" style="display:inline;" onsubmit="return confirm('确定下架此商品？')">
                            <button type="submit" class="btn btn-sm btn-danger">下架</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
