<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>分类管理 - 电商网站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <th:block th:replace="fragments/navbar :: sales('categories')"></th:block>

    <div class="container mt-4">
        <h2>分类管理</h2>

        <div th:if="${param.added}" class="alert alert-success mt-3">
            分类 "[[${param.name}]]" 已添加（分类会在添加商品时自动出现）
        </div>
        <div th:if="${param.deleted}" class="alert alert-success mt-3">分类已删除</div>
        <div th:if="${param.error}" class="alert alert-danger mt-3" th:text="${param.error}"></div>

        <p class="text-muted">产品分类基于商品数据的 category 字段自动生成。</p>

        <table class="table table-striped" th:if="${not #lists.isEmpty(categories)}">
            <thead>
                <tr>
                    <th>分类名称</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cat : ${categories}">
                    <td><span class="badge bg-secondary fs-6" th:text="${cat}"></span></td>
                    <td>
                        <a th:href="@{/products(category=${cat})}" class="btn btn-sm btn-outline-primary">查看商品</a>
                        <a th:href="@{/sales/categories/delete(category=${cat})}"
                           class="btn btn-sm btn-outline-danger ms-1"
                           onclick="return confirm('确定删除分类 [[${cat}]]？\n如果该分类下还有商品则无法删除。')">删除</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <div th:if="${#lists.isEmpty(categories)}" class="alert alert-info">暂无分类，请在添加商品时指定分类</div>

        <hr>
        <p class="text-muted small">提示：新建分类时，只需在添加新商品时填写新分类名称即可自动创建。</p>
    </div>
</body>
</html>
