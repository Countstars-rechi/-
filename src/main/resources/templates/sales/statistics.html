<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>销售统计 - 电商网站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="/sales/dashboard">销售管理</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/sales/dashboard">仪表盘</a>
                <a class="nav-link" href="/sales/products">商品管理</a>
                <a class="nav-link" href="/sales/orders">订单管理</a>
                <a class="nav-link active" href="/sales/statistics">销售统计</a>
                <a class="nav-link" href="/sales/browse-logs">浏览日志</a>
                <span class="nav-link text-light">[[${username}]]</span>
                <a class="nav-link text-light" href="/products">前台</a>
                <a class="nav-link text-light" href="/logout">退出</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>销售统计</h2>

        <!-- 销售概览 -->
        <div class="row mt-4">
            <div class="col-md-3">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h5 class="card-title">总销售额</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(totalSales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <h5 class="card-title">今日</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(todaySales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-info">
                    <div class="card-body">
                        <h5 class="card-title">本周</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(weekSales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-warning">
                    <div class="card-body">
                        <h5 class="card-title">本月</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(monthSales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 销售趋势 -->
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>销售趋势（近7天）</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>日期</th>
                                    <th>销售额</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="i : ${#numbers.sequence(0, #lists.size(trend.dates) - 1)}">
                                    <td th:text="${trend.dates[i]}">日期</td>
                                    <td th:text="'¥' + ${#numbers.formatDecimal(trend.sales[i], 1, 2)}">¥0</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>商品销售排行榜</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>排名</th>
                                    <th>商品</th>
                                    <th>类别</th>
                                    <th>销量</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${ranking}">
                                    <td th:text="${item.rank}">1</td>
                                    <td th:text="${item.productName}">商品</td>
                                    <td th:text="${item.category}">类别</td>
                                    <td th:text="${item.totalSold}">0</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- 类别销售 -->
        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5>各类别销售（本月）</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>类别</th>
                                    <th>销量</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cs : ${categorySales}">
                                    <td th:text="${cs[0]}">类别</td>
                                    <td th:text="${cs[1]}">0</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
