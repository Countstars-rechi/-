<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>销售统计 - 电商网站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
    <th:block th:replace="fragments/navbar :: sales('statistics')"></th:block>

    <div class="container mt-4">
        <h2>销售统计</h2>

        <div class="row mt-4">
            <div class="col-md-3">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h5 class="card-title">总销售额</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(totalSales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <h5 class="card-title">今日</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(todaySales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-info">
                    <div class="card-body">
                        <h5 class="card-title">本周</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(weekSales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-warning">
                    <div class="card-body">
                        <h5 class="card-title">本月</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(monthSales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 销售趋势 + 排行榜 -->
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header"><h5>销售趋势（近7天）</h5></div>
                    <div class="card-body"><div id="trendChart" style="height:350px;"></div></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header"><h5>商品销售排行榜</h5></div>
                    <div class="card-body"><div id="rankingChart" style="height:350px;"></div></div>
                </div>
            </div>
        </div>

        <!-- 类别销售 -->
        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header"><h5>各类别销售（本月）</h5></div>
                    <div class="card-body"><div id="categoryChart" style="height:350px;"></div></div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        // 趋势图
        var trendChart = echarts.init(document.getElementById('trendChart'));
        trendChart.setOption({
            tooltip: { trigger: 'axis' },
            xAxis: { type: 'category', data: [[${trend.dates}]] },
            yAxis: { type: 'value', name: '销售额 (¥)' },
            series: [{
                name: '销售额', type: 'line', smooth: true,
                data: [[${trend.sales}]],
                areaStyle: { opacity: 0.1 },
                itemStyle: { color: '#198754' }
            }]
        });

        // 排行榜
        var rankChart = echarts.init(document.getElementById('rankingChart'));
        rankChart.setOption({
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
            grid: { left: '3%', right: '10%', bottom: '3%', containLabel: true },
            xAxis: { type: 'value' },
            yAxis: {
                type: 'category',
                data: [[${ranking.![productName]}]].reverse()
            },
            series: [{
                type: 'bar',
                data: [[${ranking.![totalSold]}]].reverse(),
                itemStyle: { color: '#198754' }
            }]
        });

        // 类别销售
        var catChart = echarts.init(document.getElementById('categoryChart'));
        catChart.setOption({
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
            xAxis: {
                type: 'category',
                data: [[${catNames}]]
            },
            yAxis: { type: 'value', name: '销量' },
            series: [{
                type: 'bar',
                data: [[${catCounts}]],
                itemStyle: { color: '#198754' }
            }]
        });
    </script>
</body>
</html>
