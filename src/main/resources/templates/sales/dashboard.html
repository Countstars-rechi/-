<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>销售仪表盘 - 电商网站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="/sales/dashboard">销售管理</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="/sales/dashboard">仪表盘</a>
                <a class="nav-link" href="/sales/products">商品管理</a>
                <a class="nav-link" href="/sales/orders">订单管理</a>
                <a class="nav-link" href="/sales/statistics">销售统计</a>
                <a class="nav-link" href="/sales/browse-logs">浏览日志</a>
                <span class="nav-link text-light">[[${username}]]</span>
                <a class="nav-link text-light" href="/products">前台</a>
                <a class="nav-link text-light" href="/logout">退出</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>销售仪表盘</h2>

        <!-- 概览卡片 -->
        <div class="row mt-4">
            <div class="col-md-3">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h5 class="card-title">总销售额</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(dashboard.totalSales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <h5 class="card-title">今日销售额</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(dashboard.todaySales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-info">
                    <div class="card-body">
                        <h5 class="card-title">本周销售额</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(dashboard.weekSales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-warning">
                    <div class="card-body">
                        <h5 class="card-title">本月销售额</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(dashboard.monthSales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-3">
                <div class="card text-white bg-secondary">
                    <div class="card-body">
                        <h5 class="card-title">待处理订单</h5>
                        <p class="card-text h3" th:text="${dashboard.pendingOrders}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-danger">
                    <div class="card-body">
                        <h5 class="card-title">商品总数</h5>
                        <p class="card-text h3" th:text="${dashboard.productCount}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-info">
                    <div class="card-body">
                        <h5 class="card-title">客户数</h5>
                        <p class="card-text h3" th:text="${dashboard.customerCount}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h5 class="card-title">今日浏览</h5>
                        <p class="card-text h3" th:text="${dashboard.todayBrowseCount}">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 销售排行榜 -->
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>商品销售排行榜</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>排名</th>
                                    <th>商品</th>
                                    <th>类别</th>
                                    <th>销量</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${ranking}">
                                    <td th:text="${item.rank}">1</td>
                                    <td th:text="${item.productName}">商品</td>
                                    <td th:text="${item.category}">类别</td>
                                    <td th:text="${item.totalSold}">0</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 销售异常检测 -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>销售异常检测</h5>
                    </div>
                    <div class="card-body">
                        <p>7天平均销售额: <strong th:text="'¥' + ${#numbers.formatDecimal(anomalies.averageSales, 1, 2)}">¥0</strong></p>
                        <div th:if="${#lists.isEmpty(anomalies.anomalies)}" class="text-muted">
                            暂无异常
                        </div>
                        <div th:each="a : ${anomalies.anomalies}" class="alert" th:classappend="${a.level == '警告'} ? 'alert-warning' : 'alert-info'">
                            <span th:text="${a.date}">日期</span> -
                            销售额: <strong th:text="'¥' + ${#numbers.formatDecimal(a.sales, 1, 2)}">¥0</strong>
                            (<span th:text="${a.type}">类型</span>)
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
