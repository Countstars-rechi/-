<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>销售仪表盘 - 电商网站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
    <th:block th:replace="fragments/navbar :: sales('dashboard')"></th:block>

    <div class="container mt-4">
        <h2>销售仪表盘</h2>

        <div class="row mt-4">
            <div class="col-md-3">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h5 class="card-title">总销售额</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(dashboard.totalSales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <h5 class="card-title">今日销售额</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(dashboard.todaySales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-info">
                    <div class="card-body">
                        <h5 class="card-title">本周销售额</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(dashboard.weekSales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-warning">
                    <div class="card-body">
                        <h5 class="card-title">本月销售额</h5>
                        <p class="card-text h3" th:text="'¥' + ${#numbers.formatDecimal(dashboard.monthSales, 1, 2)}">¥0</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-3">
                <div class="card text-white bg-secondary">
                    <div class="card-body">
                        <h5 class="card-title">待处理订单</h5>
                        <p class="card-text h3" th:text="${dashboard.pendingOrders}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-danger">
                    <div class="card-body">
                        <h5 class="card-title">商品总数</h5>
                        <p class="card-text h3" th:text="${dashboard.productCount}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-info">
                    <div class="card-body">
                        <h5 class="card-title">客户数</h5>
                        <p class="card-text h3" th:text="${dashboard.customerCount}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h5 class="card-title">今日浏览</h5>
                        <p class="card-text h3" th:text="${dashboard.todayBrowseCount}">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 图表 -->
        <div class="row mt-4">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header"><h5>销售趋势（近7天）</h5></div>
                    <div class="card-body"><div id="trendChart" style="height:350px;"></div></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header"><h5>商品销售排行榜</h5></div>
                    <div class="card-body"><div id="rankingChart" style="height:350px;"></div></div>
                </div>
            </div>
        </div>

        <!-- 异常检测 -->
        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header"><h5>销售异常检测</h5></div>
                    <div class="card-body">
                        <p>7天平均销售额: <strong th:text="'¥' + ${#numbers.formatDecimal(anomalies.averageSales, 1, 2)}">¥0</strong></p>
                        <div th:if="${#lists.isEmpty(anomalies.anomalies)}" class="text-muted">近7天销售正常，无异常</div>
                        <div th:each="a : ${anomalies.anomalies}" class="alert" th:classappend="${a.level == '警告'} ? 'alert-warning' : 'alert-info'">
                            <strong th:text="${a.date}"></strong> —
                            销售额: <strong th:text="'¥' + ${#numbers.formatDecimal(a.sales, 1, 2)}"></strong>
                            (<span th:text="${a.type}"></span>)
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        var trendChart = echarts.init(document.getElementById('trendChart'));
        trendChart.setOption({
            tooltip: { trigger: 'axis' },
            xAxis: { type: 'category', data: [[${trend != null ? trend.dates : {}}]] },
            yAxis: { type: 'value', name: '销售额 (¥)' },
            series: [{
                name: '销售额', type: 'line', smooth: true,
                data: [[${trend != null ? trend.sales : {}}]],
                areaStyle: { opacity: 0.1 },
                itemStyle: { color: '#198754' },
                markLine: {
                    silent: true,
                    data: [{ type: 'average', name: '平均值' }]
                }
            }]
        });

        var rankChart = echarts.init(document.getElementById('rankingChart'));
        rankChart.setOption({
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
            grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
            xAxis: { type: 'value' },
            yAxis: {
                type: 'category',
                data: [[${#lists.toList(ranking).![productName]}]].reverse()
            },
            series: [{
                type: 'bar',
                data: [[${#lists.toList(ranking).![totalSold]}]].reverse(),
                itemStyle: { color: '#198754' }
            }]
        });
    </script>
</body>
</html>
