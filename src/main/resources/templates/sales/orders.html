<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>订单管理 - 电商网站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="/sales/dashboard">销售管理</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/sales/dashboard">仪表盘</a>
                <a class="nav-link" href="/sales/products">商品管理</a>
                <a class="nav-link active" href="/sales/orders">订单管理</a>
                <a class="nav-link" href="/sales/statistics">销售统计</a>
                <a class="nav-link" href="/sales/browse-logs">浏览日志</a>
                <span class="nav-link text-light">[[${username}]]</span>
                <a class="nav-link text-light" href="/products">前台</a>
                <a class="nav-link text-light" href="/logout">退出</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>订单管理</h2>

        <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info mt-3">暂无订单</div>

        <div th:unless="${#lists.isEmpty(orders)}" class="mt-3">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>订单号</th>
                        <th>用户</th>
                        <th>金额</th>
                        <th>状态</th>
                        <th>下单时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td th:text="${order.orderNo}">ORD123</td>
                        <td th:text="${order.user.username}">用户</td>
                        <td th:text="'¥' + ${order.totalAmount}">¥0</td>
                        <td>
                            <span class="badge" th:classappend="${order.status == 'PENDING'} ? 'bg-warning' : 
                                (${order.status == 'PAID'} ? 'bg-success' : 
                                (${order.status == 'COMPLETED'} ? 'bg-info' : 'bg-secondary'))"
                                th:text="${order.status == 'PENDING' ? '待付款' : 
                                    (order.status == 'PAID' ? '已付款' : 
                                    (order.status == 'COMPLETED' ? '已完成' : '已取消'))}">
                                状态
                            </span>
                        </td>
                        <td th:text="${order.createdAt}">2024-01-01</td>
                        <td>
                            <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary">查看</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
