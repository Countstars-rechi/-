<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>订单管理 - 电商网站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body>
    <th:block th:replace="fragments/navbar :: sales('orders')"></th:block>

    <div class="container mt-4">
        <h2>订单管理</h2>

        <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info mt-3">暂无订单</div>

        <div th:unless="${#lists.isEmpty(orders)}" class="mt-3">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>订单号</th>
                        <th>用户</th>
                        <th>金额</th>
                        <th>状态</th>
                        <th>下单时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td th:text="${order.orderNo}">ORD123</td>
                        <td th:text="${order.user.username}">用户</td>
                        <td th:text="'¥' + ${order.totalAmount}">¥0</td>
                        <td>
                            <span class="badge" th:classappend="${order.status == 'PENDING'} ? 'bg-warning text-dark' :
                                (${order.status == 'PAID'} ? 'bg-success' :
                                (${order.status == 'SHIPPED'} ? 'bg-primary' :
                                (${order.status == 'COMPLETED'} ? 'bg-info' : 'bg-secondary')))"
                                th:text="${order.status == 'PENDING' ? '待付款' :
                                    (order.status == 'PAID' ? '已付款' :
                                    (order.status == 'SHIPPED' ? '已发货' :
                                    (order.status == 'COMPLETED' ? '已完成' : '已取消')))}">
                            </span>
                        </td>
                        <td th:text="${order.createdAt}">2024-01-01</td>
                        <td>
                            <form th:if="${order.status == 'PAID'}" th:action="@{/sales/orders/{id}/ship(id=${order.id})}"
                                  method="post" style="display:inline;">
                                <button type="submit" class="btn btn-sm btn-primary">发货</button>
                            </form>
                            <form th:if="${order.status == 'SHIPPED'}" th:action="@{/sales/orders/{id}/complete(id=${order.id})}"
                                  method="post" style="display:inline;">
                                <button type="submit" class="btn btn-sm btn-success">完成</button>
                            </form>
                            <a th:href="@{/sales/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary">查看</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
