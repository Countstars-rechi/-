<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:if="${product == null}">添加商品 - 电商网站</title>
    <title th:unless="${product == null}">编辑商品 - 电商网站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body>
    <th:block th:replace="fragments/navbar :: sales('products')"></th:block>

    <div class="container mt-4">
        <h2 th:if="${product == null}">添加商品</h2>
        <h2 th:unless="${product == null}">编辑商品</h2>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <form th:if="${product == null}" th:action="@{/sales/products/add}" method="post">
                        <form th:unless="${product == null}" th:action="@{/sales/products/edit/{id}(id=${product.id})}" method="post">
                            <div class="mb-3">
                                <label for="name" class="form-label">商品名称 *</label>
                                <input type="text" class="form-control" id="name" name="name"
                                       th:value="${product?.name}" required>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">商品描述</label>
                                <textarea class="form-control" id="description" name="description" rows="3"
                                          th:text="${product?.description}"></textarea>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="price" class="form-label">价格 *</label>
                                    <input type="number" step="0.01" class="form-control" id="price" name="price"
                                           th:value="${product?.price}" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="stock" class="form-label">库存</label>
                                    <input type="number" class="form-control" id="stock" name="stock"
                                           th:value="${product?.stock ?: 0}">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="category" class="form-label">类别</label>
                                <input type="text" class="form-control" id="category" name="category"
                                       th:value="${product?.category}" placeholder="如：手机、平板、耳机">
                            </div>
                            <div class="mb-3">
                                <label for="imageUrl" class="form-label">图片URL</label>
                                <input type="text" class="form-control" id="imageUrl" name="imageUrl"
                                       th:value="${product?.imageUrl}" placeholder="https://example.com/image.jpg">
                            </div>
                            <div class="mb-3 form-check" th:unless="${product == null}">
                                <input type="checkbox" class="form-check-input" id="enabled" name="enabled"
                                       th:checked="${product?.enabled}" value="true">
                                <label class="form-check-label" for="enabled">上架</label>
                            </div>
                            <button type="submit" class="btn btn-success" th:if="${product == null}">添加</button>
                            <button type="submit" class="btn btn-primary" th:unless="${product == null}">保存</button>
                            <a href="/sales/products" class="btn btn-outline-secondary">取消</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
