<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>浏览日志 - 电商网站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body>
    <th:block th:replace="fragments/navbar :: sales('browse-logs')"></th:block>

    <div class="container mt-4">
        <h2>浏览日志分析</h2>

        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>热门浏览类别（本周）</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>类别</th>
                                    <th>浏览次数</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="hc : ${hotCategories}">
                                    <td th:text="${hc[0]}">类别</td>
                                    <td th:text="${hc[1]}">0</td>
                                </tr>
                            </tbody>
                        </table>
                        <div th:if="${#lists.isEmpty(hotCategories)}" class="text-muted">
                            暂无数据
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>最活跃用户（本周）</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>用户</th>
                                    <th>浏览次数</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="au : ${activeUsers}">
                                    <td th:text="${au[0].username}">用户</td>
                                    <td th:text="${au[1]}">0</td>
                                </tr>
                            </tbody>
                        </table>
                        <div th:if="${#lists.isEmpty(activeUsers)}" class="text-muted">
                            暂无数据
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
